<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Istanbul International School - News</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
    const { useState, useEffect } = React;

    // JSONBin Configuration
    const BIN_ID = '69615336d0ea881f40603447';
    const MASTER_KEY = '$2a$10$mXUxv26WieKbB6PxgNCqEOFpdxX9itm00IFRp0yF6QfFv5IHciI4i';
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    // Lucide icons
    const Send = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    );

    const Image = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
    );

    const X = ({ size = 24 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    );

    const Trash = ({ size = 24, className = "" }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    );

    function SchoolNewsHub() {
      const [posts, setPosts] = useState([]);
      const [textContent, setTextContent] = useState('');
      const [imageFile, setImageFile] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        loadPosts();
        // Auto-refresh posts every 10 seconds
        const interval = setInterval(loadPosts, 10000);
        return () => clearInterval(interval);
      }, []);

      const loadPosts = async () => {
        try {
          const response = await fetch(API_URL + '/latest', {
            headers: {
              'X-Master-Key': MASTER_KEY
            }
          });
          const data = await response.json();
          setPosts(data.record.posts || []);
          setLoading(false);
        } catch (error) {
          console.error('Error loading posts:', error);
          setLoading(false);
        }
      };

      const handleImageSelect = (e) => {
        const file = e.target.files[0];
        if (file) {
          if (file.size > 2000000) {
            alert('Image must be smaller than 2MB');
            return;
          }
          setImageFile(file);
          const reader = new FileReader();
          reader.onloadend = () => {
            setImagePreview(reader.result);
          };
          reader.readAsDataURL(file);
        }
      };

      const removeImage = () => {
        setImageFile(null);
        setImagePreview(null);
      };

      const handleSubmit = async () => {
        if (!textContent.trim() && !imageFile) {
          alert('Please add some text or an image');
          return;
        }

        setIsSubmitting(true);

        try {
          const newPost = {
            id: Date.now(),
            text: textContent.trim(),
            image: imagePreview,
            date: new Date().toLocaleString()
          };

          const updatedPosts = [newPost, ...posts];

          const response = await fetch(API_URL, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': MASTER_KEY
            },
            body: JSON.stringify({ posts: updatedPosts })
          });

          if (response.ok) {
            setPosts(updatedPosts);
            setTextContent('');
            setImageFile(null);
            setImagePreview(null);
          } else {
            alert('Failed to post. Please try again.');
          }
        } catch (error) {
          console.error('Error posting:', error);
          alert('Failed to post. Please try again.');
        }

        setIsSubmitting(false);
      };

      const handleDelete = async (postId) => {
        if (!confirm('Delete this post?')) return;

        try {
          const updatedPosts = posts.filter(post => post.id !== postId);

          const response = await fetch(API_URL, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'X-Master-Key': MASTER_KEY
            },
            body: JSON.stringify({ posts: updatedPosts })
          });

          if (response.ok) {
            setPosts(updatedPosts);
          } else {
            alert('Failed to delete. Please try again.');
          }
        } catch (error) {
          console.error('Error deleting:', error);
          alert('Failed to delete. Please try again.');
        }
      };

      return (
        <div className="min-h-screen bg-gray-50">
          <header className="bg-white shadow-sm border-b-2 border-blue-600">
            <div className="max-w-4xl mx-auto px-4 py-4 flex items-center gap-4">
              <div className="w-16 h-16 bg-blue-600 rounded-lg flex items-center justify-center flex-shrink-0">
                <span className="text-white font-bold text-2xl">IIS</span>
              </div>
              <div>
                <h1 className="text-2xl font-bold text-gray-900">ISTANBUL INTERNATIONAL SCHOOL</h1>
                <p className="text-sm text-gray-600">W website made by tuff guy</p>
              </div>
            </div>
          </header>

          <main className="max-w-4xl mx-auto px-4 py-8">
            <div className="bg-white rounded-lg shadow-md p-6 mb-8">
              <h2 className="text-xl font-semibold mb-4 text-gray-800">Write Something</h2>
              <div>
                <textarea
                  value={textContent}
                  onChange={(e) => setTextContent(e.target.value)}
                  placeholder="Type something RIGHT NOW"
                  className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                  rows="4"
                />
                
                {imagePreview && (
                  <div className="mt-4 relative">
                    <img src={imagePreview} alt="Preview" className="max-h-64 rounded-lg" />
                    <button
                      type="button"
                      onClick={removeImage}
                      className="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600"
                    >
                      <X size={20} />
                    </button>
                  </div>
                )}

                <div className="flex gap-3 mt-4">
                  <label className="flex items-center gap-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg cursor-pointer transition">
                    <Image size={20} className="text-gray-600" />
                    <span className="text-sm font-medium text-gray-700">Add Image</span>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={handleImageSelect}
                      className="hidden"
                    />
                  </label>

                  <button
                    onClick={handleSubmit}
                    disabled={isSubmitting}
                    className="flex items-center gap-2 px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium transition disabled:bg-gray-400"
                  >
                    <Send size={20} />
                    {isSubmitting ? 'Posting...' : 'Post Anonymously'}
                  </button>
                </div>
              </div>
            </div>

            <div className="space-y-4">
              <h2 className="text-2xl font-bold text-gray-800 mb-4">Latest News</h2>
              
              {loading ? (
                <div className="bg-white rounded-lg shadow-md p-8 text-center text-gray-500">
                  Loading posts...
                </div>
              ) : posts.length === 0 ? (
                <div className="bg-white rounded-lg shadow-md p-8 text-center text-gray-500">
                  No posts yet. Be the first to share some news!
                </div>
              ) : (
                posts.map((post) => (
                  <div key={post.id} className="bg-white rounded-lg shadow-md p-6">
                    <div className="flex items-start gap-3">
                      <div className="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold flex-shrink-0">
                        A
                      </div>
                      <div className="flex-1">
                        <div className="flex items-center justify-between mb-2">
                          <div className="flex items-center gap-2">
                            <span className="font-semibold text-gray-900">Anonymous</span>
                            <span className="text-sm text-gray-500">• {post.date}</span>
                          </div>
                          <button
                            onClick={() => handleDelete(post.id)}
                            className="text-red-500 hover:text-red-700 p-1 hover:bg-red-50 rounded transition"
                            title="Delete post"
                          >
                            <Trash size={18} />
                          </button>
                        </div>
                        
                        {post.text && (
                          <p className="text-gray-800 mb-3 whitespace-pre-wrap">{post.text}</p>
                        )}
                        
                        {post.image && (
                          <img 
                            src={post.image} 
                            alt="Post content" 
                            className="rounded-lg max-w-full h-auto"
                          />
                        )}
                      </div>
                    </div>
                  </div>
                ))
              )}
            </div>
          </main>

          <footer className="mt-12 py-6 bg-white border-t">
            <div className="max-w-4xl mx-auto px-4 text-center text-sm text-gray-600">
              <p className="mb-2">All posts are anonymous and shared with the school community.</p>
              <p>Please be respectful and follow school guidelines.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.render(<SchoolNewsHub />, document.getElementById('root'));
  </script>
</body>
</html>
